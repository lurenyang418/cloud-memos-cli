name: Cloud Memos compatibility

on:
  workflow_dispatch:
    inputs:
      allow_write:
        description: "在专用 staging 创建、编辑并删除探针 Memo"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: compatibility
    env:
      CLOUD_MEMOS_TEST_URL: ${{ secrets.CLOUD_MEMOS_TEST_URL }}
      CLOUD_MEMOS_TEST_TOKEN: ${{ secrets.CLOUD_MEMOS_TEST_TOKEN }}
      CLOUD_MEMOS_TEST_WRITE: ${{ inputs.allow_write && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.2

      - name: Validate protected secrets
        shell: bash
        run: |
          test -n "$CLOUD_MEMOS_TEST_URL"
          test -n "$CLOUD_MEMOS_TEST_TOKEN"

      - name: Run explicit compatibility test
        run: cargo test --locked --test live_compat -- --ignored --nocapture
