name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust 1.95 / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            binary: cloud-memos
            artifact: linux-x86_64
            archive_extension: tar.gz
          - name: macOS arm64
            os: macos-latest
            binary: cloud-memos
            artifact: macos-aarch64
            archive_extension: tar.gz
          - name: Windows x86_64
            os: windows-latest
            binary: cloud-memos.exe
            artifact: windows-x86_64
            archive_extension: zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Package CLI artifact
        shell: bash
        env:
          ARCHIVE: cloud-memos-${{ matrix.artifact }}.${{ matrix.archive_extension }}
          BINARY: target/release/${{ matrix.binary }}
        run: bash scripts/package-release.sh "$BINARY" "dist/$ARCHIVE"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cloud-memos-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
