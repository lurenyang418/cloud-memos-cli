name: Release

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/package-release.sh"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: cloud-memos
            archive_extension: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: cloud-memos
            archive_extension: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: cloud-memos
            archive_extension: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: cloud-memos.exe
            archive_extension: zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: release-${{ matrix.target }}

      - name: Verify release tag
        if: github.ref_type == 'tag'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          crate_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "$RELEASE_TAG" = "v$crate_version"

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binary and checksum
        shell: bash
        env:
          BINARY: target/${{ matrix.target }}/release/${{ matrix.binary }}
        run: |
          crate_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          archive="cloud-memos-v${crate_version}-${{ matrix.target }}.${{ matrix.archive_extension }}"
          bash scripts/package-release.sh "$BINARY" "dist/$archive"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cloud-memos-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: cloud-memos-*
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
