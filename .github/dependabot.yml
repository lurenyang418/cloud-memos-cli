version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # @rev selects the Rust compiler, not the Action implementation version.
      - dependency-name: dtolnay/rust-toolchain
    labels:
      - dependencies
      - ci
