[package]
name = "cloud-memos-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Cloud Memos 的安全跨平台终端客户端"
license = "MIT"
readme = "README.md"
repository = "https://github.com/lurenyang418/cloud-memos-cli"
keywords = ["cloud-memos", "tui", "markdown", "cli"]
categories = ["command-line-utilities"]
publish = false

[[bin]]
name = "cloud-memos"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
dirs = "6.0"
pulldown-cmark = "0.13"
ratatui = "0.29"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shlex = "2.0"
strip-ansi-escapes = "0.2"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "time"] }
toml = "0.8"
tui-textarea = "0.7"
url = "2.5"
uuid = { version = "1.17", features = ["serde", "v4"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
