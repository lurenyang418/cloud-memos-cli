[package]
name = "cloud-memos-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Cloud Memos 的安全跨平台终端客户端"
license = "MIT"
readme = "README.md"
repository = "https://github.com/lurenyang418/cloud-memos-cli"
keywords = ["cloud-memos", "tui", "markdown", "cli"]
categories = ["command-line-utilities"]
publish = false

[[bin]]
name = "cloud-memos"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.28"
dirs = "6.0"
keyring = "4.1"
pulldown-cmark = "0.13"
ratatui = "0.29"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rpassword = "7.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shlex = "2.0"
strip-ansi-escapes = "0.2"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }
toml = "1.1"
tui-textarea = "0.7"
url = "2.5"
uuid = { version = "1.24", features = ["serde", "v4"] }

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
